import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'com.github.spotbugs' version '6.5.5'
	id 'net.thebugmc.gradle.sonatype-central-portal-publisher' version "1.2.4"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

group = 'org.javafn'
version = "${major}.${minor}.${patch}"

java {
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
	compileOnly("com.github.spotbugs:spotbugs-annotations:4.9.+")
}

spotbugs {
	toolVersion = '4.9.8'
	ignoreFailures = false
	effort = Effort.MAX
}

tasks.withType(SpotBugsTask).configureEach {
	reports {
		html.required = true
		xml.required = false
	}
}

centralPortal {
	username = System.getenv("OSSRH_SONATYPE_USERNAME")
	password = System.getenv("OSSRH_SONATYPE_PASSWORD")

	pom {
		name = 'JavaFn Utils'
		description = 'Utility functions'
		url = 'https://github.com/javafn-org/javafn-utils'
		scm {
			connection = 'scm:git:git://github.com:javafn-org/javafn-utils.git'
			developerConnection = 'scm:git:ssh://git@github.com:javafn-org/javafn-utils.git'
			url = 'https://github.com/javafn-org/javafn-utils'
		}
		licenses {
			license {
				name = 'BSD-3-Clause'
				url = 'https://opensource.org/license/BSD-3-clause/'
			}
		}
		developers {
			developer {
				id = 'ben-stringer'
				name = 'Ben Stringer'
				email = 'ben.stringer.jr@javafn.org'
			}
			developer {
				id = 'Archthebald'
				name = 'Dakota Maulding'
				email = ''
			}
			developer {
				id = 'TrevorPatorno'
				name = 'Trevor Patorno'
				email = ''
			}
			developer {
				id = 'nichipedia'
				name = 'Nicholas Moran'
				email = ''
			}
		}
	}
}

signing {
	useGpgCmd()
	project.ext.set('signing.gnupg.executable', 'gpg')
	project.ext.set('signing.gnupg.keyName', System.getenv("OSSRH_GPG_ID"))
	project.ext.set('signing.gnupg.passphrase', System.getenv("OSSRH_GPG_SECRET_KEY_PASSWORD"))
}

tasks.withType(Sign) {
	onlyIf { System.getenv().containsKey("CI") }
}

